asyncapi: 3.1.0
info:
  title: Penvire Lab Identity events
  version: 0.2.0
  description: >-
    Events Identity publishes. Each event is a CloudEvent in Kafka binary
    content mode: the attributes travel as `ce_` headers and the record value is
    the Avro-encoded payload alone (ADR 0004 in penvire-lab-backend).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/avro
channels:
  session:
    address: identity.session
    description: >-
      Login sessions Identity establishes. The record key is the session ID, so
      the events of one session stay in order.
    messages:
      sessionStarted:
        $ref: '#/components/messages/SessionStarted'
  jwk:
    address: identity.jwk
    description: >-
      Public verification keys Identity publishes. The record key is the key ID
      (`kid`), so the events of one key stay in order.
    messages:
      jwkPublished:
        $ref: '#/components/messages/JwkPublished'
  audit:
    address: identity.audit
    description: >-
      Audit events Identity records for its security-relevant actions, including
      refused and failed ones (ADR 0006 in penvire-lab-backend). The record key
      is the target's ID, or the actor's ID when there is no target, so the
      events about one resource stay in order. When there is neither, the key is
      the event ID.
    messages:
      auditRecorded:
        $ref: '#/components/messages/AuditRecorded'
operations:
  sendSessionStarted:
    action: send
    channel:
      $ref: '#/channels/session'
    messages:
      - $ref: '#/channels/session/messages/sessionStarted'
  sendJwkPublished:
    action: send
    channel:
      $ref: '#/channels/jwk'
    messages:
      - $ref: '#/channels/jwk/messages/jwkPublished'
  sendAuditRecorded:
    action: send
    channel:
      $ref: '#/channels/audit'
    messages:
      - $ref: '#/channels/audit/messages/auditRecorded'
components:
  messages:
    SessionStarted:
      name: SessionStarted
      title: Login session started
      summary: Identity established a new login session for a user and client.
      description: >-
        Identity publishes this event when the login session is created.
        Refreshing tokens for an existing session does not produce this event.
      contentType: application/avro
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_subject
          - ce_time
          - ce_dataschema
          - content-type
        properties:
          ce_specversion:
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: UUIDv7 of the event.
          ce_source:
            const: /penvire-lab/identity
          ce_type:
            const: dev.penvire.lab.identity.session-started.v1
          ce_subject:
            type: string
            description: The session ID.
          ce_time:
            type: string
            format: date-time
            description: When the session was established.
          ce_dataschema:
            type: string
            pattern: >-
              ^urn:penvire-lab:schema:dev\.penvire\.lab\.identity\.events\.v1\.SessionStarted:[1-9][0-9]*$
            description: The schema revision the payload was written with.
          content-type:
            const: application/avro
          ce_traceparent:
            type: string
            description: W3C trace context of the operation that caused the event.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ./avro/dev.penvire.lab.identity.events.v1.SessionStarted/1.avsc
      bindings:
        kafka:
          key:
            type: string
            description: The session ID.
          bindingVersion: 0.5.0
    JwkPublished:
      name: JwkPublished
      title: JWK published
      summary: Identity added a public verification key to its JWKS.
      description: >-
        The event identifies the new key by `kid`. Consumers can fetch the key
        from the `jwks_uri` in Identity's OpenID discovery document.
      contentType: application/avro
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_subject
          - ce_time
          - ce_dataschema
          - content-type
        properties:
          ce_specversion:
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: UUIDv7 of the event.
          ce_source:
            const: /penvire-lab/identity
          ce_type:
            const: dev.penvire.lab.identity.jwk-published.v1
          ce_subject:
            type: string
            description: The published key's `kid`.
          ce_time:
            type: string
            format: date-time
            description: When the key was added to the JWKS.
          ce_dataschema:
            type: string
            pattern: >-
              ^urn:penvire-lab:schema:dev\.penvire\.lab\.identity\.events\.v1\.JwkPublished:[1-9][0-9]*$
            description: The schema revision the payload was written with.
          content-type:
            const: application/avro
          ce_traceparent:
            type: string
            description: W3C trace context of the operation that caused the event.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ./avro/dev.penvire.lab.identity.events.v1.JwkPublished/1.avsc
      bindings:
        kafka:
          key:
            type: string
            description: The published key's `kid`.
          bindingVersion: 0.5.0
    AuditRecorded:
      name: AuditRecorded
      title: Audit recorded
      summary: Identity recorded a security-relevant action and its outcome.
      description: >-
        Recorded through the outbox: in the action's transaction when it
        succeeds, and in a new transaction after it was refused or failed. The
        payload has the same shape in every service
        (`asyncapi/audit-recorded.avsc`); only the namespace differs.
      contentType: application/avro
      headers:
        type: object
        required:
          - ce_specversion
          - ce_id
          - ce_source
          - ce_type
          - ce_subject
          - ce_time
          - ce_dataschema
          - content-type
        properties:
          ce_specversion:
            const: '1.0'
          ce_id:
            type: string
            format: uuid
            description: UUIDv7 of the event.
          ce_source:
            const: /penvire-lab/identity
          ce_type:
            const: dev.penvire.lab.identity.audit-recorded.v1
          ce_subject:
            type: string
            description: >-
              The payload's `targetId`, or its `actorId` when there is no
              target, or the event ID (`ce_id`) when there is neither.
          ce_time:
            type: string
            format: date-time
            description: When the action ended.
          ce_dataschema:
            type: string
            pattern: >-
              ^urn:penvire-lab:schema:dev\.penvire\.lab\.identity\.events\.v1\.AuditRecorded:[1-9][0-9]*$
            description: The schema revision the payload was written with.
          content-type:
            const: application/avro
          ce_tenantid:
            type: string
            description: >-
              The tenant a tenant-scoped action belongs to. Absent for
              platform-scoped actions.
          ce_traceparent:
            type: string
            description: W3C trace context of the operation that caused the event.
      payload:
        schemaFormat: application/vnd.apache.avro;version=1.9.0
        schema:
          $ref: ./avro/dev.penvire.lab.identity.events.v1.AuditRecorded/1.avsc
      bindings:
        kafka:
          key:
            type: string
            description: >-
              The payload's `targetId`, or its `actorId` when there is no
              target, or the event ID (`ce_id`) when there is neither.
          bindingVersion: 0.5.0
