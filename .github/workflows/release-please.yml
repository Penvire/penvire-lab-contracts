# Keeps a release PR up to date with the changelog and next versions.
# Merging that PR tags the release, publishes it on GitHub and uploads the
# released contracts to the Forgejo package registry.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # A GitHub App token, because PRs opened with GITHUB_TOKEN don't trigger
      # the required checks, and Actions may not create PRs in this org.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One job per released service document: <service>-client and <service>-openapi.
  publish:
    name: Publish ${{ matrix.path }}
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Publish to Forgejo
        env:
          RELEASE_PATH: ${{ matrix.path }}
          ORG_GRADLE_PROJECT_forgejoUsername: ${{ vars.FORGEJO_USER }}
          ORG_GRADLE_PROJECT_forgejoPassword: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          service="${RELEASE_PATH#openapi/}"
          version=$(awk '/^info:/ { inInfo = 1 } inInfo && /^  version:/ { print $2; exit }' "$RELEASE_PATH/openapi.yaml")
          registry=$(sed -n 's/^forgejoMavenUrl=//p' gradle.properties)
          pom="$registry/dev/penvire/lab/${service}-client/${version}/${service}-client-${version}.pom"
          # Packages are public: a rerun skips versions that are already uploaded.
          if curl -fsS -o /dev/null "$pom"; then
            echo "${service} ${version} is already published."
            exit 0
          fi
          ./gradlew ":${service}-client:publishAllPublicationsToForgejoRepository" --console=plain
