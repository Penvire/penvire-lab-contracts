# Fails a pull request that breaks a contract unless its title marks it with `!` (ADR 0001).
name: Breaking changes

on:
  pull_request:
    # `edited` re-runs the check when the title changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  breaking-changes:
    name: Breaking changes
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      # Same pin as devenv.nix: generator/compat/openapi-changes.json.
      - name: Install openapi-changes
        run: |
          version=$(jq -r .version generator/compat/openapi-changes.json)
          sha256=$(jq -r '.sha256["x86_64-linux"]' generator/compat/openapi-changes.json)
          archive="$RUNNER_TEMP/openapi-changes.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/pb33f/openapi-changes/releases/download/v${version}/openapi-changes_${version}_linux_x86_64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" openapi-changes
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install contract tools
        run: pnpm install --frozen-lockfile

      - name: Check for breaking changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm run breaking
